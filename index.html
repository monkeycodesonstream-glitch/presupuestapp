<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Generador de presupuestos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600;700&family=Poppins:wght@400;600&family=Lora:wght@400;600&family=Roboto+Slab:wght@400;700&family=Raleway:wght@400;600;700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="catalogo.js"></script>
<style>
:root{--ink:#16202a;--mut:#5d6b78;--line:#d5dbe0;--bg:#dde2e6;--ac:#1a56db}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:15px/1.4 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.top{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--ink);color:#fff;flex:none;position:relative}
.top b{flex:1;font-size:15px}.top button{padding:8px 12px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:8px}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
#hb{display:flex;padding:8px;background:transparent;border-color:#ffffff55;color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
#menu{position:absolute;top:100%;left:0;right:0;max-width:420px;background:#fff;color:var(--ink);box-shadow:0 10px 30px #0004;z-index:20;display:none;border-radius:0 0 12px 0}
#menu.open{display:block}#menu button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:13px 16px}
#menu button small{display:block;color:var(--mut)}#menu button.on{background:#e8f0fe;font-weight:600}
.main{flex:1;min-height:0;display:grid;grid-template-columns:420px 1fr}
#panel{background:#fff;border-right:1px solid var(--line);overflow:auto;min-height:0}
#pv{overflow:auto;padding:14px;min-height:0}#wrap{width:794px;margin:0 auto;box-shadow:0 6px 30px #0003}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.ph b{font-size:16px}.ph button{padding:6px 10px;font-size:13px}.sec{padding:14px;display:grid;gap:14px}.sec[hidden]{display:none}
label,.lb{display:grid;gap:5px;color:var(--ink);font-size:13px;font-weight:600}.hint{color:var(--mut);font-weight:400;font-size:12.5px}
input,select,textarea{font:inherit;font-weight:400;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=color]{padding:3px;height:44px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tpls button{text-align:left;padding:12px}.tpls button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:3px;vertical-align:middle}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{flex:1;border:0;border-radius:0;min-width:70px;border-right:1px solid var(--line)}.seg button small{display:block;font-size:12px;opacity:.8}.seg button.on{background:var(--ink);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{padding:5px 11px;font-size:13px;border-radius:99px}.chips button.on{background:var(--ink);color:#fff}
#res{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px}#res button{display:flex;justify-content:space-between;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;gap:8px}#res small{color:var(--mut);white-space:nowrap}
#res button.man{background:#e8f0fe;color:#0b3da8;font-weight:600}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:#f8fafb}.it{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}.it .t{display:flex;gap:8px}.it .x{color:#b42318;padding:6px 11px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}#toast.on{opacity:1}
#edit{position:fixed;right:14px;bottom:18px;z-index:15;display:none;box-shadow:0 4px 14px #0005}
.p{width:794px;min-height:1120px;background:#fff;color:#222;font-family:var(--f);padding:48px;position:relative;font-size:13.5px;line-height:1.45}
.p h1,.p .co{font-family:var(--h);margin:0}.p h1{font-size:30px;color:var(--c);line-height:1.1}.co{font-size:19px}
.hd{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;padding-bottom:20px;border-bottom:3px solid var(--c);margin-bottom:24px}
.hd img{max-height:72px;max-width:200px;display:block;margin-bottom:8px}.tg{color:#666}.ct{white-space:pre-line;font-size:12.5px;color:#555;margin-top:4px}.hd .r{text-align:right}
.modern .hd{background:var(--c);color:#fff;margin:-48px -48px 28px;padding:36px 48px;border:0}.modern .hd h1,.modern .tg,.modern .ct{color:#fff}.modern .tg,.modern .ct{opacity:.85}
.minimal .hd{border-bottom:1px solid #ccc;flex-direction:column;align-items:center;text-align:center}.minimal .hd .r{text-align:center}.minimal h1{font-weight:400;letter-spacing:.18em}
.bold .hd{border:0;border-left:16px solid var(--c);padding:4px 0 4px 18px}.bold h1{font-size:38px}
.meta{margin-bottom:22px}.meta b{color:var(--c)}.pre{white-space:pre-line}
table{width:100%;border-collapse:collapse}th{background:var(--c);color:#fff;text-align:left;padding:8px 10px;font-weight:600}td{padding:8px 10px;border-bottom:1px solid #e3e3e3;vertical-align:top}
.minimal th{background:none;color:var(--c);border-bottom:2px solid var(--c)}.bold th{background:var(--a)}.bold td{border-bottom:2px solid #eee}
.r{text-align:right}tr{page-break-inside:avoid}.tot{margin:18px 0 0 auto;width:300px}.tot div{display:flex;justify-content:space-between;padding:4px 0}
.tot .t{border-top:2px solid var(--c);margin-top:6px;padding-top:8px;font-size:18px;font-weight:700;color:var(--c)}
.bold .tot .t{background:var(--c);color:#fff;padding:10px}.nt{margin-top:26px}.nt h4{margin:0 0 4px;color:var(--c)}.ft{margin-top:30px;text-align:center;color:#777;border-top:1px solid #ddd;padding-top:12px}
.empty{padding:30px;text-align:center;color:#999;border:2px dashed #ddd;margin-top:8px}
#wrap [data-go]{cursor:pointer}#wrap [data-go]:hover{outline:2px dashed var(--ac);outline-offset:2px}
@media(min-width:861px){.ph #fullb{display:none}}
@media(max-width:860px){.main{grid-template-columns:1fr;grid-template-rows:minmax(0,40%) minmax(0,1fr)}#pv{order:-1;padding:8px}#panel{border-right:0;border-top:3px solid var(--ink)}
 .main.full{grid-template-rows:minmax(0,1fr) 0}.main.full #panel{display:none}.main.full~#edit{display:block}}
@media(max-width:560px){.top b{display:none}.top button{flex:1}#hb{flex:none}}
</style></head><body>
<div class="top"><button id="hb" aria-label="Abrir menú"><svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><b>Generador de presupuestos</b><button id="share" class="pri">Compartir PDF</button><button id="dl">Descargar PDF</button><div id="menu"></div></div>
<div class="main" id="main"><aside id="panel"></aside><main id="pv"><div id="wrap"><div class="p" id="paper"></div></div></main></div>
<button id="edit" class="pri">Editar presupuesto</button><div id="toast"></div>
<datalist id="units"><option>un<option>m²<option>ml<option>m³<option>hs<option>día<option>gl<option>kg<option>lt<option>jgo</datalist>
<script>
const $=q=>document.querySelector(q),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=[...new Set(CAT.map(i=>i.c))];
const FONTS=['Inter','Montserrat','Poppins','DM Sans','Raleway','Lora','Playfair Display','Roboto Slab'];
const TPL={classic:['Clásico','#1f3a5f','#b8892b','Lora','Playfair Display'],modern:['Moderno','#0f766e','#f59e0b','Inter','Montserrat'],minimal:['Minimalista','#222222','#888888','DM Sans','DM Sans'],bold:['Audaz','#c2410c','#111827','Poppins','Raleway']};
const D={tpl:'classic',c:'#1f3a5f',a:'#b8892b',f:'Lora',h:'Playfair Display',title:'PRESUPUESTO',company:'Tu nombre o empresa',tagline:'Pintura, electricidad y aire acondicionado',contact:'Tel: 11 0000-0000\nmail@ejemplo.com',logo:'',clientLabel:'Cliente',client:'',clientInfo:'',num:'0001',date:new Date().toISOString().slice(0,10),notes:'',terms:'Validez: 15 días. Forma de pago: 50% anticipo y 50% al finalizar.',footer:'¡Gracias por confiar en nosotros!',cDesc:'Descripción',cQty:'Cantidad',cUnit:'Unidad',cPrice:'Precio unitario',cTotal:'Subtotal',iva:0,disc:0,cin:'ARS',cout:'ARS',dtype:'blue',items:[]};
let s;try{s={...D,...JSON.parse(localStorage.getItem('pres2')||'{}')}}catch(e){s={...D}}
let rates={},ratesAt='',rst='',cat='Todas',cur='cliente';
try{const r=JSON.parse(localStorage.getItem('rates2')||'{}');rates=r.v||{};ratesAt=r.at||''}catch(e){}
const T=(k,l,t='text')=>`<label>${l}<input data-k="${k}" type="${t}"${t=='number'?' inputmode="decimal" min="0"':''}></label>`,A=(k,l)=>`<label>${l}<textarea data-k="${k}" rows="3"></textarea></label>`;
const S=(k,l,o)=>`<label>${l}<select data-k="${k}">${o.map(x=>`<option value="${x}" style="font-family:'${x}'">${x}</option>`).join('')}</select></label>`;
const SG=(k,o)=>`<div class="seg">${o.map(([v,l,sm])=>`<button data-sk="${k}" data-sv="${v}">${l}${sm?`<small>${sm}</small>`:''}</button>`).join('')}</div>`;
const CUR=[['ARS','Pesos ($)'],['USD','Dólares (US$)']];
const SECS=[['diseno','Diseño','Plantilla, colores y tipografías'],['encabezado','Encabezado','Título, logo y tus datos'],['cliente','Cliente','Para quién es el presupuesto'],['items','Ítems','Buscar en el catálogo o cargar a mano'],['moneda','Moneda e impuestos','Pesos o dólares, descuento e IVA'],['textos','Notas y condiciones','Textos finales y nombres de columnas']];
const P={
diseno:`<div class="lb">Plantilla<div class="tpls">${Object.entries(TPL).map(([k,v])=>`<button data-t="${k}"><span class="sw" style="background:${v[1]}"></span><span class="sw" style="background:${v[2]}"></span>${v[0]}</button>`).join('')}</div></div><div class="g2">${T('c','Color principal','color')}${T('a','Color de acento','color')}</div>${S('f','Tipografía del texto',FONTS)}${S('h','Tipografía de los títulos',FONTS)}`,
encabezado:`${T('title','Título del presupuesto')}${T('company','Nombre de tu empresa o tu nombre')}${T('tagline','Subtítulo o rubro')}${A('contact','Datos de contacto (teléfono, mail, web)')}<label>Logo<input type="file" id="logo" accept="image/*"></label><button id="nologo">Quitar logo</button><div class="g2">${T('num','Número de presupuesto')}${T('date','Fecha','date')}</div>`,
cliente:`${T('client','Nombre del cliente')}${A('clientInfo','Dirección y otros datos del cliente')}${T('clientLabel','Título de este bloque (ej: Cliente, Obra, Señor/a)')}`,
items:`<div class="lb">Buscar en el catálogo<input id="q" placeholder="Ej: medianera, persiana, split, toma…" autocomplete="off"><div class="chips" id="chips"></div><div id="res"></div></div>
<div class="card"><div class="lb">Cargar un ítem a mano</div><label>Descripción<input id="mn" placeholder="Ej: Cambio de cerradura"></label><div class="g3"><label>Cantidad<input id="mq" type="number" inputmode="decimal" value="1"></label><label>Unidad<input id="mu" list="units" value="un"></label><label id="mpl">Precio unitario<input id="mp" type="number" inputmode="decimal" placeholder="0"></label></div><button class="pri" id="madd">Agregar al presupuesto</button></div>
<div class="lb" id="il">Ítems del presupuesto</div><div id="rows" style="display:grid;gap:10px"></div>`,
moneda:`<div class="lb">Los precios que cargo están en${SG('cin',CUR)}</div><div class="lb">Mostrar el presupuesto al cliente en${SG('cout',CUR)}</div>
<div id="dz" class="card"><div class="lb">Tipo de dólar para convertir<div id="rt"></div></div><div class="hint" id="rs"></div><button id="fetchr">Actualizar cotización</button></div>
<div class="g2">${T('disc','Descuento (%)','number')}${T('iva','IVA (%)','number')}</div>`,
textos:`${A('notes','Notas para el cliente')}${A('terms','Condiciones (validez, forma de pago)')}${T('footer','Mensaje final')}<div class="lb">Nombres de las columnas</div><div class="g2">${T('cDesc','Descripción')}${T('cQty','Cantidad')}${T('cUnit','Unidad')}${T('cPrice','Precio unitario')}${T('cTotal','Subtotal')}</div>`};
$('#panel').innerHTML=`<div class="ph"><b id="pt"></b><button id="fullb">Ver presupuesto completo</button></div>`+SECS.map(x=>`<section class="sec" data-s="${x[0]}" hidden>${P[x[0]]}</section>`).join('');
$('#menu').innerHTML=SECS.map(x=>`<button data-m="${x[0]}">${x[1]}<small>${x[2]}</small></button>`).join('');
function show(k){cur=k;$('#main').classList.remove('full');document.querySelectorAll('.sec').forEach(e=>e.hidden=e.dataset.s!=k);document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m==k));$('#pt').textContent=SECS.find(x=>x[0]==k)[1];$('#menu').classList.remove('open');$('#panel').scrollTop=0}
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1400)};
const sync=()=>document.querySelectorAll('[data-k]').forEach(e=>e.value=s[e.dataset.k]);
const num=v=>+v||0,R=()=>rates[s.dtype],sym=c=>c=='USD'?'US$':'$';
const conv=v=>s.cin==s.cout?v:R()?(s.cin=='ARS'?v/R():v*R()):NaN;
const fmt=v=>isFinite(v)?sym(s.cout)+' '+v.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}):'Sin cotización';
function render(){
 const w=$('#paper');[['--c',s.c],['--a',s.a],['--f',`'${s.f}'`],['--h',`'${s.h}'`]].forEach(([k,v])=>w.style.setProperty(k,v));
 const sub=s.items.reduce((a,i)=>a+num(i.q)*conv(num(i.p)),0),dc=sub*num(s.disc)/100,iv=(sub-dc)*num(s.iva)/100,tot=sub-dc+iv;
 const rw=s.items.map((i,x)=>`<tr data-go="items:#${x}"><td>${esc(i.n)}</td><td class="r">${num(i.q)}</td><td>${esc(i.u)}</td><td class="r">${fmt(conv(num(i.p)))}</td><td class="r">${fmt(conv(num(i.p))*num(i.q))}</td></tr>`).join('');
 $('#paper').className='p '+s.tpl;
 $('#paper').innerHTML=`<div class="hd"><div>${s.logo?`<img data-go="encabezado:logo" src="${s.logo}">`:''}<div class="co" data-go="encabezado:company">${esc(s.company)}</div><div class="tg" data-go="encabezado:tagline">${esc(s.tagline)}</div><div class="ct" data-go="encabezado:contact">${esc(s.contact)}</div></div><div class="r"><h1 data-go="encabezado:title">${esc(s.title)}</h1><div data-go="encabezado:num">N.º ${esc(s.num)}</div><div data-go="encabezado:date">${esc(s.date.split('-').reverse().join('/'))}</div></div></div>
 <div class="meta"><b data-go="cliente:clientLabel">${esc(s.clientLabel)}</b><div data-go="cliente:client">${esc(s.client)||'&nbsp;'}</div><div class="pre" data-go="cliente:clientInfo">${esc(s.clientInfo)}</div></div>
 <table><thead><tr><th data-go="textos:cDesc">${esc(s.cDesc)}</th><th class="r" data-go="textos:cQty">${esc(s.cQty)}</th><th data-go="textos:cUnit">${esc(s.cUnit)}</th><th class="r" data-go="textos:cPrice">${esc(s.cPrice)}</th><th class="r" data-go="textos:cTotal">${esc(s.cTotal)}</th></tr></thead><tbody>${rw}</tbody></table>${s.items.length?'':'<div class="empty" data-go="items:q">Tocá acá para agregar ítems</div>'}
 <div class="tot" data-go="moneda:disc"><div><span>Subtotal</span><span>${fmt(sub)}</span></div>${dc?`<div><span>Descuento ${num(s.disc)}%</span><span>- ${fmt(dc)}</span></div>`:''}${iv?`<div><span>IVA ${num(s.iva)}%</span><span>${fmt(iv)}</span></div>`:''}<div class="t"><span>TOTAL</span><span>${fmt(tot)}</span></div>${s.cin!=s.cout&&R()?`<div style="font-size:11px;color:#777">Cotización dólar ${s.dtype}: $ ${R().toLocaleString('es-AR')}</div>`:''}</div>
 ${s.notes?`<div class="nt" data-go="textos:notes"><h4>Notas</h4><div class="pre">${esc(s.notes)}</div></div>`:''}${s.terms?`<div class="nt" data-go="textos:terms"><h4>Condiciones</h4><div class="pre">${esc(s.terms)}</div></div>`:''}<div class="ft" data-go="textos:footer">${esc(s.footer)}</div>`;
 try{localStorage.setItem('pres2',JSON.stringify(s))}catch(e){}fit()}
const fit=()=>{$('#wrap').style.zoom=Math.min(1,($('#pv').clientWidth-($('#pv').offsetWidth<500?16:30))/794)};
function rows(){$('#il').textContent=`Ítems del presupuesto (${s.items.length})`;$('#mpl').firstChild.textContent=`Precio unitario (${sym(s.cin)})`;
 $('#rows').innerHTML=s.items.length?s.items.map((i,x)=>`<div class="it" data-x="${x}"><div class="t"><input data-f="n" value="${esc(i.n)}" aria-label="Descripción"><button class="x" data-del="${x}" aria-label="Quitar ítem">✕</button></div><div class="g3"><label>Cantidad<input data-f="q" type="number" inputmode="decimal" value="${i.q}"></label><label>Unidad<input data-f="u" list="units" value="${esc(i.u)}"></label><label>Precio (${sym(s.cin)})<input data-f="p" type="number" inputmode="decimal" value="${i.p||''}" placeholder="0"></label></div></div>`).join(''):'<div class="hint">Todavía no agregaste ítems.</div>'}
function res(){const q=$('#q').value.trim(),ql=q.toLowerCase();const r=CAT.filter(i=>(cat=='Todas'||i.c==cat)&&(i.n+' '+i.c).toLowerCase().includes(ql)).slice(0,40);
 $('#res').innerHTML=(q?`<button class="man" data-addm="1">+ Agregar “${esc(q)}” como ítem manual</button>`:'')+r.map(i=>`<button data-add="${CAT.indexOf(i)}"><span>${esc(i.n)}</span><small>${i.c} · ${i.u}</small></button>`).join('')||'<div class="hint" style="padding:10px">Escribí para buscar o elegí una categoría.</div>';
 $('#chips').innerHTML=['Todas',...CATS].map(c=>`<button data-cat="${c}" class="${c==cat?'on':''}">${c}</button>`).join('')}
const add=(n,u='un',q=1,p=0)=>{s.items.push({n,u,q,p});rows();render();toast('Agregado al presupuesto ✓')};
function segs(){document.querySelectorAll('[data-sk]').forEach(b=>b.classList.toggle('on',s[b.dataset.sk]==b.dataset.sv));document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==s.tpl));$('#dz').hidden=s.cin==s.cout}
function rt(){const L=[['blue','Blue'],['oficial','Oficial'],['mep','MEP'],['tarjeta','Tarjeta']];
 $('#rt').innerHTML=SG('dtype',L.map(([k,l])=>[k,l,rates[k]?'$ '+rates[k].toLocaleString('es-AR'):'—']));
 $('#rs').textContent=rst=='load'?'Consultando cotización…':rst=='err'&&!R()?'No se pudo obtener la cotización. Revisá tu conexión y tocá “Actualizar”.':ratesAt?`Valor de venta, consultado por API a las ${new Date(ratesAt).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}${rst=='err'?' (última cotización guardada)':''}.`:'';segs()}
async function getRates(){rst='load';rt();let o=null;
 const tries=[async()=>{const r=await fetch('/api/dolar');if(!r.ok)throw 0;return await r.json()},
  async()=>{const d=await (await fetch('https://dolarapi.com/v1/dolares')).json(),g=c=>(d.find(x=>x.casa==c)||{}).venta;return{oficial:g('oficial'),blue:g('blue'),mep:g('bolsa'),tarjeta:g('tarjeta')}},
  async()=>{const d=await (await fetch('https://api.bluelytics.com.ar/v2/latest')).json();return{oficial:d.oficial.value_sell,blue:d.blue.value_sell}}];
 for(const t of tries){try{o=await t();if(o&&(o.blue||o.oficial))break}catch(e){}}
 if(o){rates={...rates,...Object.fromEntries(Object.entries(o).filter(([k,v])=>['blue','oficial','mep','tarjeta'].includes(k)&&v))};ratesAt=new Date().toISOString();rst='ok';try{localStorage.setItem('rates2',JSON.stringify({v:rates,at:ratesAt}))}catch(e){}}else rst='err';
 rt();render()}
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k,f=t.dataset.f;
 if(k){s[k]=t.type=='number'?num(t.value):t.value;render()}
 else if(f){const i=s.items[t.closest('.it').dataset.x];i[f]=(f=='q'||f=='p')?num(t.value):t.value;render()}
 else if(t.id=='q')res()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='q'){const b=$('#res button');if(b)b.click();e.target.blur()}});

  const file=new File([blob],name,{type:'application/pdf'});

  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}}
 catch(e){if(e.name!='AbortError')alert('No se pudo generar el PDF: '+e.message)}
